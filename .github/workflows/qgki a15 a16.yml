# 1. Install dependencies
sudo apt-get update && sudo apt-get install -y bc bison build-essential dwarves flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libelf-dev libssl-dev make python3 wget zip lld llvm patch

# 2. Clone kernel source and SUSFS patches
git clone --depth=1 https://github.com/AOSP-for-vili/android_kernel_xiaomi_sm8350.git -b lineage-23.2 kernel
cd kernel
git clone --depth=1 https://github.com/simonpunk/susfs4oki.git -b android14-5.4 susfs_patches || git clone --depth=1 https://github.com/sidex15/susfs4oki.git -b android12-5.4 susfs_patches || true

# Apply SUSFS file-system patches safely (avoiding netfilter hook crashes)
if [ -d "susfs_patches/kernel_patches" ]; then
  cp -rf susfs_patches/kernel_patches/fs/* fs/ || true
  cp -rf susfs_patches/kernel_patches/include/* include/ || true
fi

# 3. Clone Clang toolchain
git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r416183b.git ../clang-toolchain

# 4. Configure defconfig and enable KPM / KProbes / SUSFS flags
make O=out gki_defconfig
./scripts/config --file out/.config \
  --enable CONFIG_KPROBES \
  --enable CONFIG_HAVE_KPROBES \
  --enable CONFIG_KPROBE_EVENTS \
  --enable CONFIG_KALLSYMS \
  --enable CONFIG_KALLSYMS_ALL \
  --enable CONFIG_KPM \
  --enable CONFIG_KSU_SUSFS \
  --disable CONFIG_WERROR \
  --disable CONFIG_DEBUG_FS \
  --disable CONFIG_DEBUG_KERNEL \
  --disable CONFIG_PRINTK \
  --disable CONFIG_PRINTK_INDEX \
  --disable CONFIG_DYNAMIC_DEBUG
make O=out ARCH=arm64 olddefconfig

# 5. Compile the kernel
export PATH="$(pwd)/../clang-toolchain/bin:$PATH"
make O=out -j$(nproc) \
  CC=clang \
  LD=ld.lld \
  AR=llvm-ar \
  NM=llvm-nm \
  OBJCOPY=llvm-objcopy \
  OBJDUMP=llvm-objdump \
  STRIP=llvm-strip \
  CROSS_COMPILE=aarch64-linux-gnu- \
  CROSS_COMPILE_ARM32=arm-linux-gnueabi-
