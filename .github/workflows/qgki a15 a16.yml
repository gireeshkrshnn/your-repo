name: Build Vili Stock Kernel - WildKSU + SUSFS 2.2.0+ + KPM

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Disk Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 16384
          temp-reserve-mb: 100
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Clean Runner Storage
        run: |
          set -eux
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo rm -rf /var/cache/apt/archives/*
          df -h

      - name: Install Build Dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl dwarves flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git \
            libelf-dev libssl-dev make python3 rsync unzip wget zip lld llvm patch
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Clone Vili Kernel Tree
        run: |
          set -euo pipefail
          git clone \
            --depth=1 \
            --branch lineage-21 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git \
            kernel

          cd kernel
          rm -rf techpack/datarmnet || true
          make kernelversion

      - name: Add WildKSU
        run: |
          set -euo pipefail
          cd kernel
          git submodule add https://github.com/WildKernels/Wild_KSU.git drivers/kernelsu || true
          git submodule update --init --recursive || true

      - name: Download SUSFS 2.2.0+ for Kernel 5.4
        run: |
          set -euo pipefail
          cd kernel
          git clone \
            --depth=1 \
            --branch kernel-5.4 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs
          git -C susfs log -1 --oneline

      - name: Apply SUSFS 2.2.0+ Patches
        run: |
          set -euo pipefail
          cd kernel

          if [ -d susfs/kernel_patches/fs ]; then
            cp -af susfs/kernel_patches/fs/. fs/
          fi

          if [ -d susfs/kernel_patches/include/linux ]; then
            mkdir -p include/linux
            cp -af susfs/kernel_patches/include/linux/. include/linux/
          fi

          SUSFS_PATCH=$(find susfs/kernel_patches -maxdepth 1 -type f -name "50_add_susfs_in_kernel*.patch" | head -1)
          if [ -z "$SUSFS_PATCH" ]; then
            echo "ERROR: No kernel-5.4 SUSFS patch was found."
            exit 1
          fi

          patch -p1 --forward --reject-file=- < "$SUSFS_PATCH" || true

      - name: Configure Vili Stock Kernel
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out

          DEFCONFIG=$(find arch/arm64/configs -name "*gki*" -o -name "*lahaina*" -o -name "*sm8350*" | head -1 | xargs basename)
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG="gki_defconfig"
          fi
          echo "Using defconfig: $DEFCONFIG"

          make O=out ARCH=arm64 "$DEFCONFIG"

      - name: Enable WildKSU, SUSFS and KPM Requirements
        run: |
          set -euo pipefail
          cd kernel
          ./scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KPM \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --disable CONFIG_WERROR

          make O=out ARCH=arm64 olddefconfig

      - name: Clone Clang Toolchain
        run: |
          set -euo pipefail
          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r416183b.git \
            clang-toolchain

      - name: Compile Kernel
        run: |
          set -euo pipefail
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out \
            ARCH=arm64 \
            -j"$(nproc)" \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            V=1

      - name: Verify and Package Kernel
        run: |
          set -euo pipefail
          cd kernel
          test -f out/arch/arm64/boot/Image

          mkdir -p compiled_zip
          cp out/arch/arm64/boot/Image compiled_zip/

          find out -type f -name "dtb.img" -exec cp {} compiled_zip/ \; || true
          find out -type f -name "dtbo.img" -exec cp {} compiled_zip/ \; || true

          cd compiled_zip
          zip -r ../../vili-wildksu-susfs-kpm.zip .

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vili-WildKSU-SUSFS-KPM
          path: kernel/vili-wildksu-susfs-kpm.zip
