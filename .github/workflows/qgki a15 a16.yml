name: Build Vili Stock Kernel - Wild KSU Next + SUSFS + KPM

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # FREE DISK SPACE
      # ============================================================

      - name: Maximize Build Disk Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 100
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Clean Runner Storage
        run: |
          set -eux

          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo rm -rf /var/cache/apt/archives/*

          echo "===== DISK ====="
          df -h
          echo "===== INODES ====="
          df -i

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Build Dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            dwarves \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            make \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            lld \
            llvm \
            patch

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "===== DISK AFTER DEPENDENCIES ====="
          df -h

      # ============================================================
      # CLONE VILI KERNEL
      # ============================================================

      - name: Clone Vili Kernel
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch lineage-21 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git \
            kernel

          cd kernel

          echo "===== KERNEL VERSION ====="
          make kernelversion

          echo "===== RMNET HEADER ====="
          find techpack -name "rmnet_map.h" -print || true

          echo "===== RMNET DIRECTORIES ====="
          find techpack \
            -maxdepth 3 \
            -type d \
            -iname "*rmnet*" \
            -print || true

      # ============================================================
      # WILD KSU / KERNELSU NEXT
      # ============================================================

      - name: Add Wild KSU Next
        run: |
          set -euo pipefail

          cd kernel

          echo "===== ADDING KERNELSU NEXT ====="

          curl --fail --location --proto '=https' -LSs \
            https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh \
            | bash -s dev-susfs

          git submodule update --init --recursive

          echo "===== KERNELSU CHECK ====="

          if [ ! -d "KernelSU-Next" ]; then
            echo "ERROR: KernelSU-Next was not added."
            exit 1
          fi

          find KernelSU-Next -maxdepth 2 -type f | head -50

      # ============================================================
      # SUSFS
      # ============================================================

      - name: Download SUSFS
        run: |
          set -euo pipefail

          cd kernel

          git clone \
            --depth=1 \
            --branch android14-5.4 \
            https://github.com/simonpunk/susfs4oki.git \
            susfs

          echo "===== SUSFS VERSION ====="
          git -C susfs log -1 --oneline

      - name: Check SUSFS Patches
        run: |
          set -euo pipefail

          cd kernel

          echo "===== SUSFS FILES ====="

          find susfs/kernel_patches \
            -maxdepth 3 \
            -type f \
            -print | head -100

          echo "===== SEARCH SUSFS PATCHES ====="

          find susfs/kernel_patches \
            -type f \
            \( \
              -name "*.patch" \
              -o -name "*.diff" \
            \) \
            -print

      # ============================================================
      # VILI DEFCONFIG
      # ============================================================

      - name: Configure Vili Stock Kernel
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          mkdir -p out

          echo "===== SEARCHING FOR VILI CONFIG ====="

          find arch/arm64/configs \
            -type f \
            \( \
              -iname "*vili*" \
              -o -iname "*sm8350*" \
            \) \
            -print

          DEFCONFIG=""

          if [ -f arch/arm64/configs/vili_defconfig ]; then
            DEFCONFIG="vili_defconfig"

          elif [ -f arch/arm64/configs/vendor/vili_defconfig ]; then
            DEFCONFIG="vendor/vili_defconfig"

          elif [ -f arch/arm64/configs/vendor/vili-perf_defconfig ]; then
            DEFCONFIG="vendor/vili-perf_defconfig"
          fi

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: Vili defconfig was not found."
            echo
            echo "Available Qualcomm configs:"
            find arch/arm64/configs \
              -type f \
              | grep -Ei 'sm8350|vili|lahaina' \
              | head -100 || true
            exit 1
          fi

          echo "Using defconfig: $DEFCONFIG"

          make O=out ARCH=arm64 "$DEFCONFIG"

      # ============================================================
      # KSU CONFIG
      # ============================================================

      - name: Enable KernelSU Requirements
        run: |
          set -euo pipefail

          cd kernel

          ./scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --enable CONFIG_KPROBES \
            --enable CONFIG_HAVE_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --disable CONFIG_WERROR

          make O=out ARCH=arm64 olddefconfig

          echo "===== KSU CONFIG ====="

          grep -E \
            '^CONFIG_KSU=|^CONFIG_KALLSYMS=|^CONFIG_KALLSYMS_ALL=|^CONFIG_KPROBES=|^CONFIG_KPROBE_EVENTS=' \
            out/.config || true

      # ============================================================
      # STOCK POWER MANAGEMENT CHECK
      # ============================================================

      - name: Verify Stock Power Management
        run: |
          cd kernel

          echo "===== POWER MANAGEMENT ====="

          grep -E \
            '^CONFIG_PM=|^CONFIG_PM_SLEEP=|^CONFIG_SUSPEND=|^CONFIG_CPU_IDLE=|^CONFIG_CPU_FREQ=' \
            out/.config || true

          echo
          echo "===== THERMAL ====="

          grep -E \
            '^CONFIG_THERMAL=|^CONFIG_THERMAL_OF=' \
            out/.config || true

          echo
          echo "Stock suspend, sleep and thermal configuration is retained."

      # ============================================================
      # KPATCH NEXT / KPM SOURCE
      # ============================================================

      - name: Get KPatch Next
        run: |
          set -euo pipefail

          cd kernel

          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/KPatch-Next.git \
            kpatch-next

          echo "===== KPATCH NEXT ====="

          git -C kpatch-next log -1 --oneline

          echo "===== KPATCH FILES ====="

          find kpatch-next \
            -maxdepth 3 \
            -type f \
            -print | head -100

      # ============================================================
      # KPM SOURCE CHECK
      # ============================================================

      - name: Check KPM Integration
        run: |
          set -euo pipefail

          cd kernel

          echo "===== SEARCHING KPM IMPLEMENTATION ====="

          find kpatch-next \
            -type f \
            \( \
              -name "*.c" \
              -o -name "*.h" \
              -o -name "Makefile" \
              -o -name "Kconfig" \
            \) \
            -print | head -200

          echo
          echo "KPM source has been downloaded."
          echo "KALLSYMS prerequisites are enabled."

      # ============================================================
      # CLANG
      # ============================================================

      - name: Clone Clang Toolchain
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r416183b.git \
            clang-toolchain

      # ============================================================
      # COMPILER CHECK
      # ============================================================

      - name: Check Compiler
        run: |
          set -euo pipefail

          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"

          echo "===== CLANG ====="
          clang --version

          echo
          echo "===== LLVM ====="
          llvm-ar --version | head -1

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Kernel
        run: |
          set -euo pipefail

          cd kernel

          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64

          echo "===== KERNEL VERSION ====="
          make O=out ARCH=arm64 kernelversion

          echo
          echo "===== START BUILD ====="

          make O=out \
            ARCH=arm64 \
            -j"$(nproc)" \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            V=1

      # ============================================================
      # OUTPUT CHECK
      # ============================================================

      - name: Check Kernel Output
        run: |
          set -euo pipefail

          cd kernel

          echo "===== KERNEL OUTPUT ====="

          find out \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
              -o -name "dtb.img" \
              -o -name "dtbo.img" \
            \) \
            -print

          if [ ! -f out/arch/arm64/boot/Image ] && \
             [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "ERROR: Kernel Image was not produced."
            exit 1
          fi

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package Kernel
        run: |
          set -euo pipefail

          cd kernel

          mkdir -p compiled_zip

          find out/arch/arm64/boot \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
            \) \
            -exec cp {} compiled_zip/ \; || true

          find out \
            -type f \
            -name "dtb.img" \
            -exec cp {} compiled_zip/ \; || true

          find out \
            -type f \
            -name "dtbo.img" \
            -exec cp {} compiled_zip/ \; || true

          echo "===== PACKAGE CONTENT ====="
          ls -lah compiled_zip

          cd compiled_zip

          zip -r \
            ../../vili-stock-wildksu-next-susfs-kpm.zip \
            .

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vili-Stock-WildKSU-Next-SUSFS-KPM
          path: kernel/vili-stock-wildksu-next-susfs-kpm.zip
