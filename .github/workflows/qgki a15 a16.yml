name: Build Lineage 23.2 Vili Kernel with WildKSU, SUSFS & KPM

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Disk Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 100
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential dwarves flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libelf-dev libssl-dev make python3 wget zip lld llvm patch

      - name: Clone Lineage 23.2 Kernel Tree & Inject Modules
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git -b lineage-23.2 kernel
          cd kernel
          
          # Inject WildKSU
          git submodule add https://github.com/WildKernels/Wild_KSU.git drivers/kernelsu || true
          
          # Inject SUSFS patches
          git clone --depth=1 https://github.com/simonpunk/susfs4oki.git -b android14-5.4 susfs_patches || \
          git clone --depth=1 https://github.com/sidex15/susfs4oki.git -b android12-5.4 susfs_patches || true

          if [ -d "susfs_patches/kernel_patches" ]; then
            cp -rf susfs_patches/kernel_patches/fs/* fs/ || true
            cp -rf susfs_patches/kernel_patches/include/* include/ || true
          fi

      - name: Clone Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r416183b.git clang-toolchain || true

      - name: Configure Kernel with Optimizations & Security
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Find and use the correct defconfig for vili on sm8350
          make O=out gki_defconfig || make O=out vendor/vili_defconfig || make O=out msm_defconfig

          ./scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KPM \
            --enable CONFIG_KPROBES \
            --enable CONFIG_HAVE_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --enable CONFIG_CPU_IDLE \
            --enable CONFIG_CPU_FREQ_GOV_SCHEDUTIL \
            --enable CONFIG_ENERGY_MODEL \
            --disable CONFIG_WERROR \
            --disable CONFIG_DEBUG_FS \
            --disable CONFIG_DEBUG_KERNEL \
            --disable CONFIG_PRINTK \
            --disable CONFIG_PRINTK_INDEX \
            --disable CONFIG_DYNAMIC_DEBUG \
            --disable CONFIG_DEBUG_INFO

          make O=out ARCH=arm64 olddefconfig

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH="${{ github.workspace }}/clang-toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          make O=out -j$(nproc) \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package Flashable Output ZIP
        run: |
          cd kernel
          mkdir -p compiled_zip
          find out -name "Image" -exec cp {} compiled_zip/ \;
          find out -name "dtb.img" -exec cp {} compiled_zip/ \; || true
          find out -name "dtbo.img" -exec cp {} compiled_zip/ \; || true
          cd compiled_zip
          zip -r ../../lineage-23.2-vili-wildksu-susfs-kpm.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lineage-23.2-vili-WildKSU-SuFS-KPM
          path: kernel/lineage-23.2-vili-wildksu-susfs-kpm.zip
