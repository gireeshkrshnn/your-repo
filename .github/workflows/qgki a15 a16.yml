name: Build vili GKI Kernel (A13-A17, WildKSU + SUSFS + KPM)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential dwarves flex gcc-aarch64-linux-gnu git libelf-dev libssl-dev make python3 wget zip lld llvm repo

      - name: Clone Stock Source & Setup WildKSU with KPM & SUSFS
        run: |
          git clone --depth=1 https://github.com/AOSP-for-vili/android_kernel_xiaomi_sm8350.git -b lineage-23.2 kernel
          cd kernel
          git submodule add https://github.com/WildKernels/Wild_KSU.git drivers/kernelsu

      - name: Configure Build Target and Apply Optimizations
        run: |
          cd kernel
          
          # Locate and update the target defconfig file managed by MSM build configs
          if [ -f "arch/arm64/configs/vendor/lahaina_defconfig" ]; then
            DEFCONFIG_PATH="arch/arm64/configs/vendor/lahaina_defconfig"
          elif [ -f "arch/arm64/configs/vendor/msm-lahaina_defconfig" ]; then
            DEFCONFIG_PATH="arch/arm64/configs/vendor/msm-lahaina_defconfig"
          else
            DEFCONFIG_PATH="arch/arm64/configs/gki_defconfig"
          fi

          ./scripts/config --file $DEFCONFIG_PATH \
            --enable CONFIG_WQ_POWER_EFFICIENT_DEFAULT \
            --enable CONFIG_CPU_FREQ_GOV_SCHEDUTIL \
            --enable CONFIG_PM_AUTOSLEEP \
            --enable CONFIG_SUSPEND \
            --enable CONFIG_SUSPEND_FREEZER \
            --enable CONFIG_KPM \
            --enable CONFIG_KPROBES \
            --enable CONFIG_HAVE_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --disable CONFIG_DEBUG_KMEMLEAK \
            --disable CONFIG_PSTORE \
            --disable CONFIG_PSTORE_CONSOLE \
            --disable CONFIG_PSTORE_PMSG \
            --disable CONFIG_PSTORE_RAM \
            --disable CONFIG_PRINTK \
            --disable CONFIG_PRINTK_INDEX \
            --disable CONFIG_DYNAMIC_DEBUG \
            --disable CONFIG_DEBUG_FS \
            --disable CONFIG_DEBUG_KERNEL \
            --disable CONFIG_SLUB_DEBUG \
            --disable CONFIG_FTRACE \
            --disable CONFIG_TRACING

      - name: Compile Kernel via Android Build Script
        run: |
          cd kernel
          export BUILD_CONFIG=build.config.msm.lahaina
          if [ -f "build.sh" ]; then
            ./build.sh
          else
            make ARCH=arm64 gki_defconfig
            make ARCH=arm64 -j$(nproc)
          fi

      - name: Package Flashable Output ZIP
        run: |
          cd kernel
          mkdir -p compiled_zip
          find out -name "Image" -exec cp {} compiled_zip/ \; || find . -name "Image" -exec cp {} compiled_zip/ \;
          find out -name "dtbo.img" -exec cp {} compiled_zip/ \; || true
          cd compiled_zip
          zip -r ../../vili-gki-a13-a17-wildksu-kpm.zip *
