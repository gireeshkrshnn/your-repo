name: Build vili GKI Kernel (A13-A17, WildKSU + SUSFS + KPM)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential dwarves flex gcc-aarch64-linux-gnu git libelf-dev libssl-dev make python3 wget zip lld llvm

      - name: Clone Stock Source & Setup WildKSU with KPM & SUSFS
        run: |
          git clone --depth=1 https://github.com/AOSP-for-vili/android_kernel_xiaomi_sm8350.git -b lineage-23.2 kernel
          cd kernel
          git submodule add https://github.com/WildKernels/Wild_KSU.git drivers/kernelsu

      - name: Clone Official AOSP Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r416183b.git clang-toolchain || git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+/refs/heads/main/clang-r450784d clang-toolchain || true

      - name: Configure GKI Target, KPM, Battery/Sleep Parameters
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          
          make O=out gki_defconfig

          ./scripts/config --file out/.config \
            --enable CONFIG_WQ_POWER_EFFICIENT_DEFAULT \
            --enable CONFIG_CPU_FREQ_GOV_SCHEDUTIL \
            --enable CONFIG_PM_AUTOSLEEP \
            --enable CONFIG_SUSPEND \
            --enable CONFIG_SUSPEND_FREEZER \
            --enable CONFIG_KPM \
            --disable CONFIG_DEBUG_KMEMLEAK \
            --disable CONFIG_PSTORE \
            --disable CONFIG_PSTORE_CONSOLE \
            --disable CONFIG_PSTORE_PMSG \
            --disable CONFIG_PSTORE_RAM \
            --disable CONFIG_PRINTK \
            --disable CONFIG_PRINTK_INDEX \
            --disable CONFIG_DYNAMIC_DEBUG \
            --disable CONFIG_DEBUG_FS \
            --disable CONFIG_DEBUG_KERNEL \
            --disable CONFIG_SLUB_DEBUG \
            --disable CONFIG_FTRACE \
            --disable CONFIG_TRACING

          ./scripts/config --file out/.config \
            --enable CONFIG_KPROBES \
            --enable CONFIG_HAVE_KPROBES \
            --enable CONFIG_KPROBE_EVENTS

          make O=out ARCH=arm64 olddefconfig

      - name: Compile Core Kernel Image with AOSP Clang
        run: |
          cd kernel
          export PATH="${{ github.workspace }}/kernel/../clang-toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          
          make O=out CC=clang LD=ld.lld -j$(nproc)

      - name: Package Flashable Output ZIP
        run: |
          cd kernel
          mkdir -p compiled_zip
          cp out/arch/arm64/boot/Image compiled_zip/
          
          if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
            cp out/arch/arm64/boot/dtbo.img compiled_zip/
          fi
          
          cd compiled_zip
          zip -r ../../vili-gki-a13-a17-wildksu-kpm.zip *
