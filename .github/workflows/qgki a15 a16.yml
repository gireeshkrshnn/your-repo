name: Build Vili Stock 5.4 Kernel - KernelSU Next + SUSFS + KPM

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # DISK SPACE
      # ============================================================

      - name: Maximize Build Disk Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 100
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Clean Runner Storage
        run: |
          set -eux

          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo rm -rf /var/cache/apt/archives/*

          echo "===== DISK ====="
          df -h

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Build Dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            dwarves \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            make \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            lld \
            llvm \
            patch

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "===== DISK AFTER DEPENDENCIES ====="
          df -h

      # ============================================================
      # VILI KERNEL
      # ============================================================

      - name: Clone Vili Kernel
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch lineage-21 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git \
            kernel

          cd kernel

          echo "===== KERNEL VERSION ====="
          make kernelversion

          echo "===== RMNET HEADER ====="
          find techpack -name "rmnet_map.h" -print || true

          echo "===== RMNET DIRECTORIES ====="
          find techpack \
            -maxdepth 3 \
            -type d \
            -iname "*rmnet*" \
            -print || true

      # ============================================================
      # KERNELSU NEXT
      # ============================================================

      - name: Add KernelSU Next
        run: |
          set -euo pipefail

          cd kernel

          echo "===== ADDING KERNELSU NEXT ====="

          curl --fail --location --proto '=https' -LSs \
            https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh \
            | bash -s dev-susfs

          git submodule update --init --recursive

          test -d KernelSU-Next/kernel

          echo "KernelSU Next added successfully."

      # ============================================================
      # SUSFS - LINUX 5.4 COMPATIBLE TREE
      # ============================================================

      - name: Download SUSFS for Kernel 5.4
        run: |
          set -euo pipefail

          cd kernel

          git clone \
            --depth=1 \
            --branch kernel-5.4 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          echo "===== SUSFS COMMIT ====="
          git -C susfs log -1 --oneline

          echo "===== SUSFS FILES ====="
          find susfs/kernel_patches \
            -maxdepth 3 \
            -type f \
            -print

      # ============================================================
      # APPLY SUSFS 5.4 PATCH
      # ============================================================

      - name: Apply SUSFS 5.4
        run: |
          set -euo pipefail

          cd kernel

          echo "===== SUSFS PATCH FILES ====="

          find susfs/kernel_patches \
            -type f \
            \( \
              -name "*.patch" \
              -o -name "*.diff" \
            \) \
            -print

          # Copy SUSFS source files.
          if [ -d susfs/kernel_patches/fs ]; then
            cp -af susfs/kernel_patches/fs/. fs/
          fi

          if [ -d susfs/kernel_patches/include/linux ]; then
            mkdir -p include/linux
            cp -af susfs/kernel_patches/include/linux/. include/linux/
          fi

          # Find the 5.4 SUSFS kernel patch.
          SUSFS_PATCH=$(find susfs/kernel_patches \
            -maxdepth 1 \
            -type f \
            -name "50_add_susfs_in_kernel*.patch" \
            | head -1)

          if [ -z "$SUSFS_PATCH" ]; then
            echo "ERROR: No kernel-5.4 SUSFS patch was found."
            exit 1
          fi

          echo "Using SUSFS patch:"
          echo "$SUSFS_PATCH"

          patch -p1 < "$SUSFS_PATCH"

      # ============================================================
      # APPLY SUSFS KERNELSU PATCH
      # ============================================================

      - name: Apply SUSFS KernelSU Integration
        run: |
          set -euo pipefail

          cd kernel

          KSU_PATCH=$(find susfs/kernel_patches \
            -type f \
            -name "10_enable_susfs_for_ksu*.patch" \
            | head -1)

          if [ -z "$KSU_PATCH" ]; then
            echo "No KernelSU SUSFS patch found."
            echo "Continuing because this tree may already contain the required integration."
            exit 0
          fi

          echo "Using:"
          echo "$KSU_PATCH"

          cd KernelSU-Next

          patch -p1 < "../$KSU_PATCH" || {
            echo "KernelSU SUSFS patch did not apply cleanly."
            exit 1
          }

      # ============================================================
      # FIND VILI DEFCONFIG
      # ============================================================

      - name: Configure Vili Stock Kernel
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          mkdir -p out

          echo "===== VILI CONFIGS ====="

          find arch/arm64/configs \
            -type f \
            \( \
              -iname "*vili*" \
              -o -iname "*sm8350*" \
            \) \
            -print

          DEFCONFIG=""

          if [ -f arch/arm64/configs/vili_defconfig ]; then
            DEFCONFIG="vili_defconfig"
          elif [ -f arch/arm64/configs/vendor/vili_defconfig ]; then
            DEFCONFIG="vendor/vili_defconfig"
          elif [ -f arch/arm64/configs/vendor/vili-perf_defconfig ]; then
            DEFCONFIG="vendor/vili-perf_defconfig"
          fi

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: Vili defconfig not found."
            exit 1
          fi

          echo "Using: $DEFCONFIG"

          make O=out ARCH=arm64 "$DEFCONFIG"

      # ============================================================
      # KERNELSU + SUSFS + KPM REQUIREMENTS
      # ============================================================

      - name: Enable KernelSU SUSFS and KPM Requirements
        run: |
          set -euo pipefail

          cd kernel

          ./scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --disable CONFIG_WERROR

          # Enable SUSFS only when the option exists.
          if grep -q '^CONFIG_KSU_SUSFS' out/.config; then
            ./scripts/config --file out/.config \
              --enable CONFIG_KSU_SUSFS
          fi

          make O=out ARCH=arm64 olddefconfig

          echo "===== ROOT / SUSFS / KPM CONFIG ====="

          grep -E \
            '^CONFIG_KSU=|^CONFIG_KSU_SUSFS|^CONFIG_KALLSYMS=|^CONFIG_KALLSYMS_ALL=' \
            out/.config || true

      # ============================================================
      # KPM
      # ============================================================

      - name: Download KPatch Next
        run: |
          set -euo pipefail

          cd kernel

          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/KPatch-Next.git \
            kpatch-next

          echo "===== KPATCH NEXT ====="
          git -C kpatch-next log -1 --oneline

          echo "KPM requirements:"
          grep -E \
            '^CONFIG_KALLSYMS=|^CONFIG_KALLSYMS_ALL=' \
            out/.config

      # ============================================================
      # STOCK POWER MANAGEMENT
      # ============================================================

      - name: Verify Stock Power Management
        run: |
          cd kernel

          echo "===== POWER MANAGEMENT ====="

          grep -E \
            '^CONFIG_PM=|^CONFIG_PM_SLEEP=|^CONFIG_SUSPEND=|^CONFIG_CPU_IDLE=|^CONFIG_CPU_FREQ=' \
            out/.config || true

          echo
          echo "===== THERMAL ====="

          grep -E \
            '^CONFIG_THERMAL=|^CONFIG_THERMAL_OF=' \
            out/.config || true

          echo
          echo "Stock suspend/sleep/thermal configuration retained."

      # ============================================================
      # CLANG
      # ============================================================

      - name: Clone Clang Toolchain
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r416183b.git \
            clang-toolchain

      - name: Check Compiler
        run: |
          set -euo pipefail

          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"

          clang --version

      # ============================================================
      # BUILD
      # ============================================================

      - name: Compile Kernel
        run: |
          set -euo pipefail

          cd kernel

          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64

          echo "===== KERNEL VERSION ====="
          make O=out ARCH=arm64 kernelversion

          echo "===== BUILDING ====="

          make O=out \
            ARCH=arm64 \
            -j"$(nproc)" \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            V=1

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify Kernel Image
        run: |
          set -euo pipefail

          cd kernel

          echo "===== OUTPUT ====="

          find out/arch/arm64/boot \
            -maxdepth 1 \
            -type f \
            -print

          test -f out/arch/arm64/boot/Image

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package Kernel
        run: |
          set -euo pipefail

          cd kernel

          mkdir -p compiled_zip

          cp out/arch/arm64/boot/Image compiled_zip/

          find out \
            -type f \
            -name "dtb.img" \
            -exec cp {} compiled_zip/ \; || true

          find out \
            -type f \
            -name "dtbo.img" \
            -exec cp {} compiled_zip/ \; || true

          echo "===== PACKAGE ====="
          ls -lah compiled_zip

          cd compiled_zip

          zip -r \
            ../../vili-stock-ksunext-susfs-kpm.zip \
            .

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vili-Stock-KernelSU-Next-SUSFS-KPM
          path: kernel/vili-stock-ksunext-susfs-kpm.zip
