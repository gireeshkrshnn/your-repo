name: Build Vili Ultimate Gaming Kernel (ReSukiSU + SUSFS 2.3.0 + KPM)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Disk Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 16384
          temp-reserve-mb: 100
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install Build Dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl dwarves flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git \
            libelf-dev libssl-dev make python3 rsync unzip wget zip lld llvm patch
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Clone Kernel Sources & AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/unknownbuilder1/kernel_xiaomi_sm8350-los.git kernel
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cd kernel
          make kernelversion

      - name: Add ReSukiSU Drivers
        run: |
          set -euo pipefail
          cd kernel
          rm -rf drivers/kernelsu || true
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git resukisu-repo
          mv resukisu-repo/kernel drivers/kernelsu
          rm -rf resukisu-repo
          
          # Fix Kconfig integration so defconfig doesn't fail to find drivers/kernelsu/Kconfig
          if ! grep -q "kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi

      - name: Download SUSFS 2.3.0+ for Kernel 5.4
        run: |
          set -euo pipefail
          cd kernel
          git clone --depth=1 --branch kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu.git susfs

      - name: Apply SUSFS 2.3.0+ Patches
        run: |
          set -euo pipefail
          cd kernel

          if [ -d susfs/kernel_patches/fs ]; then
            cp -af susfs/kernel_patches/fs/. fs/
          fi

          if [ -d susfs/kernel_patches/include/linux ]; then
            mkdir -p include/linux
            cp -af susfs/kernel_patches/include/linux/. include/linux/
          fi

          SUSFS_PATCH=$(find susfs/kernel_patches -maxdepth 1 -type f -name "50_add_susfs_in_kernel*.patch" | head -1)
          patch -p1 --forward --reject-file=- < "$SUSFS_PATCH" || true

      - name: Configure Kernel Defconfig
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out
          make O=out ARCH=arm64 gki_defconfig

      - name: Inject Gaming, Performance OC, & KPM Flags
        run: |
          set -euo pipefail
          cd kernel
          ./scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KPM \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --disable CONFIG_WERROR \
            --disable CONFIG_PM_AUTOSLEEP \
            --enable CONFIG_WQ_POWER_EFFICIENT_DEFAULT \
            --enable CONFIG_ENERGY_MODEL \
            --enable CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE \
            --disable CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL \
            --enable CONFIG_HZ_1000 \
            --set-val HZ 1000

          make O=out ARCH=arm64 olddefconfig

      - name: Clone Clang Toolchain
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b.git clang-toolchain

      - name: Compile Gaming Kernel
        run: |
          set -euo pipefail
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export KCFLAGS="-w"

          make O=out \
            ARCH=arm64 \
            -j"$(nproc)" \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Bundle into AnyKernel3 Recovery Flashable Zip
        run: |
          set -euo pipefail
          test -f kernel/out/arch/arm64/boot/Image

          cp kernel/out/arch/arm64/boot/Image anykernel/
          find kernel/out -type f -name "dtb.img" -exec cp {} anykernel/ \; || true
          find kernel/out -type f -name "dtbo.img" -exec cp {} anykernel/ \; || true

          rm -rf anykernel/.git anykernel/.github

          cd anykernel
          zip -r ../Vili-Ultimate-Gaming-Kernel-A13-A17.zip .

      - name: Upload Final Flashable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vili-Ultimate-Gaming-Kernel-ReSukiSU-SUSFS-KPM
          path: Vili-Ultimate-Gaming-Kernel-A13-A17.zip
